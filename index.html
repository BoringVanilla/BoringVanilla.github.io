<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de DNS SRV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; margin-bottom: 1.5rem; color: #6366f1; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #4f46e5; }
        .result-container {
            margin-top: 1.5rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 1rem;
            display: none;
        }
        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        pre { margin: 0; font-family: monospace; color: #22c55e; word-break: break-all; font-size: 0.9rem; }
        .copy-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 4px 8px; font-size: 0.8rem; width: auto; margin: 0; }
        .copy-btn:hover { background: #334155; color: white; }
        .helper { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de DNS SRV</h1>

    <div class="form-group">
        <label>Domínio Principal</label>
        <input type="text" id="domain" placeholder="ex: jogo.com">
    </div>

    <div class="form-group">
        <label>Subdomínio Desejado</label>
        <input type="text" id="subdomain" placeholder="ex: mc (vai criar mc.jogo.com)">
        <div class="helper">Deixe vazio se quiser usar só o domínio principal</div>
    </div>

    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Porta</label>
                <input type="number" id="port" placeholder="25565">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Protocolo</label>
                <select id="protocol">
                    <option value="tcp">TCP</option>
                    <option value="udp">UDP</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Serviço (Tipo)</label>
        <select id="service">
            <option value="_minecraft._tcp">Minecraft (Java)</option>
            <option value="_minecraft._udp">Minecraft (Bedrock)</option>
            <option value="_teamspeak3._tcp">TeamSpeak 3</option>
            <option value="_ts3._udp">TS3 (Alternativo)</option>
            <option value="_http._tcp">HTTP / Site</option>
            <option value="_ftp._tcp">FTP</option>
            <option value="_generic._tcp">Genérico (_servico)</option>
        </select>
    </div>

    <div class="form-group">
        <label>IP ou Host de Destino</label>
        <input type="text" id="target" placeholder="192.168.1.10">
    </div>

    <button onclick="generateSRV()">Gerar SRV</button>

    <div class="result-container" id="resultBox">
        <div class="result-label">
            <span>Código gerado:</span>
            <button class="copy-btn" onclick="copyToClipboard()">Copiar</button>
        </div>
        <pre id="output"></pre>
    </div>
</div>

<script>
    function generateSRV() {
        const domain = document.getElementById('domain').value.trim();
        const subdomain = document.getElementById('subdomain').value.trim();
        const port = document.getElementById('port').value;
        const protocol = document.getElementById('protocol').value;
        const service = document.getElementById('service').value.split('.'); // Pega serviço e protocolo
        const target = document.getElementById('target').value.trim();

        if (!domain || !port || !target) {
            alert("Preencha: Domínio, Porta e IP/Host de Destino!");
            return;
        }

        // Monta o host completo
        // Se não colocar subdomain, usa o domínio principal
        const host = subdomain.length > 0 
            ? `${subdomain}.${domain}.` 
            : `${domain}.`;

        // Gera o tipo de serviço (ex: _minecraft._tcp)
        const protoSelect = document.getElementById('service').value;
        const finalServiceType = protoSelect.includes('_generic') 
            ? `_servico.${protocol}` // Se for genérico, usa o que seleccionou (tcp/udp)
            : protoSelect; 

        // Formato Bind/CloudFlare/Generic DNS Standard:
        // HostnameTTLClassTypePriorityWeightPortTarget
        // Ex: _minecraft._tcp.jogo.com. 3600 IN SRV 0 5 25565 192.168.1.10.

        const result = `${host} 3600 IN SRV 0 5 ${port} ${target}.`;

        document.getElementById('output').innerText = result;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Copiado!");
        });
    }
</script>

</body>
</html>
