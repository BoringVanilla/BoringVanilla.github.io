<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisVortex - Cyber Defense</title>
<style>
/* ======================== VARIÁVEIS ======================== */
:root {
    --bg-dark: #030508;
    --bg-panel: #0a0f14;
    --primary: #00ff41;
    --secondary: #00e5ff;
    --danger: #ff0055;
    --text-main: #cfcfcf;
    --text-muted: #556;
    --font-main: 'Courier New', monospace;
    --neon-glow: 0 0 10px var(--primary), 0 0 20px var(--primary);
    --neon-blue: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
}

* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-main);
    overflow-x: hidden;
}

/* ======================== ANIMAÇÕES CORE ======================== */
@keyframes scanline { 0% { top: -10%; } 100% { top: 110%; } }
@keyframes glitch-anim {
    0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
    40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
    60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
    80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
    100% { clip-path: inset(30% 0 50% 0); transform: translate(0); }
}
@keyframes matrixRain { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
@keyframes typing { from { width: 0; } to { width: 100%; } }
@keyframes blink { 50% { border-color: transparent; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes borderRun { 0% { background-position: 0 0, 100% 0, 0 100%, 0 100%; } 100% { background-position: 100% 0, 0 100%, 0 0, 100% 0; } }

/* ======================== CURSOR ======================== */
#cursor {
    position: fixed; width: 20px; height: 20px;
    border: 1px solid var(--primary); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%); mix-blend-mode: difference;
    transition: width 0.2s, height 0.2s;
}
#cursor::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 4px; height: 4px; background: var(--danger);
    transform: translate(-50%, -50%); border-radius: 50%;
}

/* ======================== SCROLL BAR ======================== */
#progressBar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%; z-index: 10000;
    box-shadow: 0 0 10px var(--primary);
}

/* ======================== SCANLINE ======================== */
.scanline-overlay {
    position: fixed; left: 0; width: 100%; height: 5px;
    background: rgba(0, 255, 65, 0.05);
    box-shadow: 0 0 15px var(--primary);
    z-index: 900;
    animation: scanline 4s linear infinite;
    pointer-events: none;
}

/* ======================== LOADER ======================== */
#loader {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-box {
    border: 1px solid var(--primary); padding: 40px; width: 450px;
    background: #000; position: relative;
    overflow: hidden; box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
}
.loader-text {
    color: var(--primary); font-size: 1.2rem;
    border-right: 2px solid var(--primary); white-space: nowrap;
    overflow: hidden; display: inline-block;
    animation: typing 2s steps(25) forwards, blink 0.5s step-end infinite;
    width: 25ch;
}
.loader-bar {
    position: absolute; bottom: 0; left: 0; height: 2px;
    background: var(--primary); width: 0%;
    box-shadow: 0 0 10px var(--primary);
}
.skip-btn {
    position: absolute; bottom: 20px; right: 20px;
    background: transparent; border: 1px solid #333; color: #555;
    padding: 10px 20px; font-family: inherit; font-size: 0.8rem;
    cursor: pointer; transition: 0.3s;
}
.skip-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ======================== MATRIX BG ======================== */
#matrix-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent 0%, var(--bg-dark) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.03) 3px);
    z-index: -2; background-size: 100% 100%, 100% 4px;
    animation: matrixRain 20s linear infinite;
    pointer-events: none;
}

/* ======================== MAIN CONTENT ======================== */
#main-content { opacity: 0; transition: opacity 1s ease; }
#main-content.visible { opacity: 1; }

/* ======================== HEADER ======================== */
header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 50px; background: rgba(3, 5, 8, 0.9); backdrop-filter: blur(5px);
    position: fixed; width: 100%; z-index: 100;
    border-bottom: 1px solid rgba(0,255,65,0.1);
}
.logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }
.logo span { color: var(--primary); text-shadow: var(--neon-glow); }
nav a {
    color: var(--text-muted); text-decoration: none; margin-left: 30px;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
}
nav a:hover { color: var(--secondary); text-shadow: var(--neon-blue); letter-spacing: 2px; }

/* ======================== HERO ======================== */
.hero {
    height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; perspective: 1000px;
}
.hero-title { font-size: 8rem; line-height: 1; background: linear-gradient(180deg, #fff, #555); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-title-2 { font-size: 8rem; line-height: 1; color: var(--primary); -webkit-text-fill-color: var(--primary); text-shadow: var(--neon-glow); }
.glitch-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
.hero:hover .glitch-layer:nth-child(2) { color: var(--danger); animation: glitch-anim 0.3s infinite; opacity: 0.8; }
.hero:hover .glitch-layer:nth-child(3) { color: var(--secondary); animation: glitch-anim 0.3s infinite reverse; opacity: 0.8; }
.hero-sub { color: var(--primary); font-size: 1.2rem; margin-top: 20px; }
.btn-cyber {
    margin-top: 40px; padding: 15px 50px; background: transparent;
    border: 1px solid var(--primary); color: var(--primary);
    font-family: inherit; font-size: 1rem; letter-spacing: 2px;
    position: relative; overflow: hidden; transition: 0.3s; cursor: pointer;
}
.btn-cyber::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,65,0.3), transparent); transition: 0.5s; }
.btn-cyber:hover::before { left: 100%; }
.btn-cyber:hover { background: var(--primary); color: #000; box-shadow: 0 0 30px rgba(0,255,65,0.4); }

/* ======================== DASHBOARD ======================== */
.dashboard { padding: 100px 50px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
.stat-card { background: var(--bg-panel); border: 1px solid #222; padding: 30px; position: relative; transition: 0.3s; }
.stat-card:hover { transform: translateY(-5px); border-color: var(--primary); }
.stat-number { font-size: 3rem; color: var(--text-main); font-weight: bold; animation: pulse 2s infinite; }
.stat-label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-top: 10px; }

/* ======================== SERVICES ======================== */
.services-section { padding: 100px 50px; max-width: 1200px; margin: 0 auto; }
.section-title { font-size: 2.5rem; text-align: center; margin-bottom: 50px; }
.section-title::after { content: ''; display: block; width: 50px; height: 2px; background: var(--primary); margin: 10px auto 0; }
.flip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; perspective: 1000px; }
.flip-card { height: 350px; transform-style: preserve-3d; transition: transform 0.8s; cursor: pointer; }
.flip-card:hover { transform: rotateY(180deg); }
.flip-card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.flip-front, .flip-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 30px; text-align: center; border: 1px solid #222; background: var(--bg-panel);
}
.flip-back { transform: rotateY(180deg); border-color: var(--secondary); background: rgba(0, 229, 255, 0.05); }
.icon-cyber { font-size: 4rem; color: var(--primary); margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
.flip-back h3 { color: var(--secondary); margin-bottom: 15px; }

/* ======================== DIVIDER ======================== */
.divider { height: 150px; background: linear-gradient(to bottom, var(--bg-dark), var(--bg-panel)), linear-gradient(to top, var(--bg-dark), var(--bg-panel)); display: flex; align-items: center; justify-content: center; }
.divider-text { font-size: 3rem; letter-spacing: 20px; opacity: 0.1; font-weight: bold; }

/* ======================== CONTACT ======================== */
.contact-section { padding: 100px 50px; text-align: center; max-width: 800px; margin: 0 auto; }
.input-cyber { width: 100%; max-width: 400px; padding: 15px; margin: 10px; background: #000; border: 1px solid #333; color: var(--primary); font-family: inherit; outline: none; transition: 0.3s; }
.input-cyber:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,65,0.2); }
.btn-submit { padding: 15px 40px; background: var(--primary); border: none; color: #000; font-family: inherit; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
.btn-submit:hover { box-shadow: 0 0 30px var(--primary); }

/* ======================== FOOTER ======================== */
footer { padding: 50px; text-align: center; color: #444; font-size: 0.8rem; border-top: 1px solid #111; margin-top: 50px; }
footer span { color: var(--primary); }

/* ======================== RESPONSIVE ======================== */
@media (max-width: 768px) {
    .hero-title, .hero-title-2 { font-size: 4rem; }
    .dashboard { grid-template-columns: 1fr; }
    header { padding: 20px; }
    nav { display: none; }
}
</style>
</head>
<body>

<!-- LOADING SCREEN -->

            <div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-front">
                        <div class="icon-cyber">🛡️</
